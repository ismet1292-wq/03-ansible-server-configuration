---
- name: Configure Nginx on the local Ubuntu demonstration host
  hosts: local
  become: true

  pre_tasks:
    - name: Require a Debian-family host
      ansible.builtin.assert:
        that:
          - ansible_facts['os_family'] == 'Debian'
        fail_msg: This playbook requires a Debian-family Linux host.

  tasks:
    - name: Install Nginx with a recently refreshed package cache
      ansible.builtin.apt:
        name: nginx
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Ensure Nginx is running
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true

    - name: Verify the local HTTP endpoint
      ansible.builtin.uri:
        url: http://127.0.0.1/
        status_code: 200
        return_content: false
      become: false
      when: not ansible_check_mode
