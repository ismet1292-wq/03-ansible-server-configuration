name: Validate Ansible
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the tested Ansible version
        run: python -m pip install ansible-core==2.20.1
      - name: Check playbook syntax
        run: ansible-playbook -i inventory.ini nginx.yml --syntax-check
      - name: Verify configuration, HTTP response and idempotency
        run: python scripts/verify.py
